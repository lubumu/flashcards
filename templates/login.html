{% extends "layout.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="login-panel">
  <p class="eyebrow">Geschuetzter Bereich</p>
  <h1>Anmeldung</h1>
  <p class="lede">Bitte gib das feste Passwort ein, um den Vokabeltrainer zu verwenden.</p>

  {% if error_message %}
  <p class="login-error">{{ error_message }}</p>
  {% endif %}

  <form method="post" class="login-form">
    <input type="hidden" name="next" value="{{ next_page }}">
    <label for="access_code">Passwort</label>
    <input id="access_code" name="access_code" type="password" required autofocus>
    <button class="reveal-button" type="submit">Einloggen</button>
  </form>
</section>
{% endblock %}
